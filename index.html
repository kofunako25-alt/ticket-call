<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整理券 呼出システム</title></head><body><main><h1>整理券 呼出システム</h1><p>番号ボタンを押してください。</p><div id="buttons"></div><p id="status">音声を読み込み中…</p><button id="stop">再生停止</button></main><script>
const sounds=new Map();let current=null,playing=false;const status=document.querySelector('#status');const grid=document.querySelector('#buttons');async function load(){const files=['呼出音.mp3',...Array.from({length:18},(_,i)=>`${i+1}.mp3`)];await Promise.all(files.map(async f=>{try{const r=await fetch('audio/'+encodeURIComponent(f));if(r.ok){const b=await r.blob();sounds.set(f==='呼出音.mp3'?'intro':f.replace('.mp3',''),URL.createObjectURL(b));}}catch(e){}}));status.textContent=sounds.size===19?'全18番号の音声を準備しました':'一部の音声が読み込めません';document.querySelectorAll('.num').forEach(b=>b.disabled=playing||!sounds.has(b.dataset.n)||!sounds.has('intro'));}async function play(n){if(playing)return;if(!sounds.has('intro')||!sounds.has(String(n))){status.textContent='音声を読み込めませんでした';return;}playing=true;update();status.textContent=n+'番を呼び出しています…';try{for(const k of ['intro',String(n)]){current=new Audio(sounds.get(k));await new Promise((resolve,reject)=>{current.addEventListener('ended',resolve,{once:true});current.addEventListener('error',()=>reject(new Error()),{once:true});current.play().catch(reject);});}status.textContent=n+'番の呼び出しが完了しました';}catch(e){status.textContent='再生できませんでした。ページを再読み込みしてください。';}finally{current=null;playing=false;update();}}function update(){document.querySelectorAll('.num').forEach(b=>b.disabled=playing||!sounds.has(b.dataset.n)||!sounds.has('intro'));}for(let n=1;n<=18;n++){const b=document.createElement('button');b.className='num';b.dataset.n=n;b.textContent=n+'番';b.disabled=true;b.style.cssText='font-size:22px;padding:18px;margin:6px;min-width:90px';b.onclick=()=>play(n);grid.appendChild(b);}document.querySelector('#stop').onclick=()=>{if(current){current.pause();current.currentTime=0;current=null;}playing=false;status.textContent='再生を停止しました';update();};load();
</script></body></html>
